name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python3 tooling/step4_build_deck.py A1

      - uses: softprops/action-gh-release@v2
        with:
          files: decks/Swedish_A1.apkg
          generate_release_notes: true
